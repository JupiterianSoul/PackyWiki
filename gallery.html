<!doctype html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="utf-8">
<title>Wiklodo — pack gallery (dev)</title>
<!--
  Dev-only gallery: every pack design the app can produce, on one page.
  Served by `npm run dev` at /gallery.html; it is not part of the build.
  This renders the REAL pack element (src/packview.js), so what you see here
  is what ships.
-->
<link rel="stylesheet" href="/src/style.css">
<style>
  body { background: radial-gradient(120% 90% at 50% 0%, #10142a, #06070d); padding: 26px; }
  h2 { color: #e7eaf6; font: 700 15px system-ui; letter-spacing: .14em; text-transform: uppercase;
       margin: 30px 0 16px; opacity: .8; }
  .grid { display: flex; flex-wrap: wrap; gap: 34px 22px; align-items: flex-end; }
  .slot { display: grid; gap: 10px; justify-items: center; }
  .slot i { color: #8b93b8; font: 600 11px system-ui; font-style: normal; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { buildPackElement } from '/src/packview.js';
import { THEME_PACKS } from '/src/data/packs.js';
import { RARITIES } from '/src/data/rarities.js';
import { setLanguage } from '/src/i18n.js';

setLanguage('en');
const root = document.getElementById('root');
const section = (title) => {
  const h = document.createElement('h2');
  h.textContent = title;
  root.appendChild(h);
  const g = document.createElement('div');
  g.className = 'grid';
  root.appendChild(g);
  return g;
};
const put = (grid, spec, opts, label) => {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.appendChild(buildPackElement(spec, opts));
  const i = document.createElement('i');
  i.textContent = label ?? '';
  slot.appendChild(i);
  grid.appendChild(slot);
};

const themes = section('all eighteen subjects · small');
for (const theme of THEME_PACKS) {
  put(themes, { kind: 'theme', themeId: theme.id, rarityId: null, cards: 5 },
    { size: 'is-small' }, theme.id);
}

const hero = section('hero · interactive');
put(hero, { kind: 'theme', themeId: 'space', rarityId: null, cards: 5 },
  { size: 'is-hero', interactive: true }, 'space, ready to rip');
put(hero, { kind: 'theme', themeId: 'f1', rarityId: null, cards: 5 },
  { size: 'is-hero', interactive: true }, 'f1');

const tiers = section('rarity boosters · small');
for (const r of RARITIES) {
  put(tiers, { kind: 'open', themeId: null, rarityId: r.id, cards: 5 },
    { size: 'is-small' }, r.id);
}

const tiny = section('shelf tiny');
for (const id of ['space', 'books', 'art', 'cactus', 'movies', 'history']) {
  put(tiny, { kind: 'theme', themeId: id, rarityId: null, cards: 3 }, { size: 'is-tiny' }, id);
}

const custom = section('custom packs · procedural (each from its wiki alone)');
for (const host of ['terraria.fandom.com', 'stardewvalley.fandom.com', 'zelda.fandom.com',
  'minecraft.fandom.com', 'onepiece.fandom.com', 'hollowknight.fandom.com']) {
  put(custom, { kind: 'custom', customName: host.split('.')[0], cards: 5,
    wiki: { apiUrl: `https://${host}/api.php`, sitename: host.split('.')[0] } },
    { size: 'is-small' }, host.split('.')[0]);
}

/* --- cards: backs and every rarity ---------------------------------------- */
import { RARITIES as TIERS } from '/src/data/rarities.js';
import { iconSvg } from '/src/data/icons.js';

const CARD_FRONT = `
  <div class="fx fx-a"></div><div class="fx-c"></div>
  <div class="card-art"><div class="card-art-fallback">${iconSvg('space', { size: 38 })}</div></div>
  <div class="card-body">
    <h3 class="card-title">Antikythera mechanism</h3>
    <p class="card-desc">Stub article</p>
    <p class="card-extract">An ancient Greek hand-powered orrery, the oldest known example of an analogue computer, used to predict astronomical positions.</p>
  </div>
  <div class="card-stats"><span class="card-price">฿1,240</span><span class="card-views">92k/month</span></div>
  <div class="card-footer"><span class="rarity-badge"></span></div>
  <div class="fx fx-b"></div>
  <div class="fx-ring"></div>`;

const backs = section('card backs · halftone pop, in the pack’s colours');
for (const [id, a, b] of [['space', '#818cf8', '#312e81'], ['f1', '#ef4444', '#450a0a'],
  ['plants', '#4ade80', '#14532d'], ['books', '#fbbf24', '#78350f']]) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.innerHTML = `<div class="card" style="--back-accent:${a};--back-accent2:${b};width:200px">
    <div class="card-inner">
      <div class="card-face card-back">
        <div class="back-field"><div class="back-rays"></div><div class="back-dots"></div></div>
        <div class="back-zip"></div>
        <div class="back-burst">${iconSvg('burst', { size: 120 })}</div>
        <div class="back-icon">${iconSvg(id, { size: 52 })}</div>
        <div class="back-word">WIKLODO</div>
      </div>
    </div></div><i>${id}</i>`;
  backs.appendChild(slot);
}

const fronts = section('every rarity treatment');
for (const r of TIERS) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  const card = document.createElement('div');
  card.className = 'card is-revealed is-lit';
  card.style.width = '220px';
  card.dataset.rarity = r.id;
  card.style.setProperty('--rarity', r.color);
  card.style.setProperty('--rarity-glow', r.glow);
  card.innerHTML = `<div class="card-inner" style="transform:none">
    <div class="card-face card-front" style="transform:none">${CARD_FRONT}</div></div>`;
  card.querySelector('.rarity-badge').textContent = r.id;
  slot.appendChild(card);
  const i = document.createElement('i');
  i.textContent = r.id;
  slot.appendChild(i);
  fronts.appendChild(slot);
}
</script>
</body>
</html>
