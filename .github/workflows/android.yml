name: Build Android APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # VITE_ variables are compiled into the bundle, so they have to be set
      # here rather than at runtime. Both are public by design (see
      # .env.example); if the secrets are not set the build still succeeds and
      # ships an offline-only app that says so in Settings, rather than an APK
      # with a sign-in screen no key can open.
      - name: Build the web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::warning::No SUPABASE_URL/SUPABASE_ANON_KEY secrets set — this APK plays offline only."
          fi

      # The APK is a WebView wrapper around dist/, so the web build has to be
      # staged into the Android assets folder before Gradle packages it.
      - name: Stage web build into Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/
          echo "Staged files:"
          find android/app/src/main/assets -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        # BUILD_NUMBER feeds versionCode, so each build is newer than the last.
        # The signing key is committed (see android/app/build.gradle), which is
        # what makes every build update in place instead of demanding an
        # uninstall and taking the player's collection with it.
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk wiklodo-debug.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiklodo-apk
          path: wiklodo-debug.apk
          if-no-files-found: error

      # A release asset gives a direct, tappable .apk link — an artifact only
      # downloads as a zip, which is awkward on a phone.
      - name: Publish to the rolling "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest wiklodo-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Wiklodo — latest debug APK" \
            --notes "Sideloadable debug build of \`$GITHUB_SHA\`.

          **Install:** download \`wiklodo-debug.apk\` below, tap it, and allow
          your browser to install unknown apps when prompted.

          Debug-signed, so if an existing Wiklodo install refuses to update,
          uninstall it first. Needs a network connection — cards are fetched
          live from Wikipedia."
