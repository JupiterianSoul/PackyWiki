name: Build Android APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The Supabase URL and publishable key come from the committed
      # .env.production, which Vite reads during the build. They are public by
      # design and ship inside the APK either way, so there is nothing a secret
      # would protect here. They must NOT be passed in as env vars as well:
      # Vite gives process.env precedence over .env files, so an unset secret
      # would arrive as an empty string and silently blank them out, shipping
      # an APK that cannot sign in.
      - name: Build the web app
        run: |
          npm ci
          npm run build
          grep -q "supabase.co" dist/assets/*.js \
            || { echo "::error::Built bundle has no Supabase project in it."; exit 1; }

      # The APK is a WebView wrapper around dist/, so the web build has to be
      # staged into the Android assets folder before Gradle packages it.
      - name: Stage web build into Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/
          echo "Staged files:"
          find android/app/src/main/assets -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        working-directory: android
        # BUILD_NUMBER feeds versionCode, so each build is newer than the last.
        # The signing key is committed (see android/app/build.gradle), which is
        # what makes every build update in place instead of demanding an
        # uninstall and taking the player's collection with it.
        #
        # Release rather than debug: Play Protect scans every sideloaded APK
        # whatever we do, but a debuggable build is the one Android warns
        # hardest about. Same key either way, so this still installs over an
        # existing copy.
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk wiklodo.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiklodo-apk
          path: wiklodo.apk
          if-no-files-found: error

      # A release asset gives a direct, tappable .apk link - an artifact only
      # downloads as a zip, which is awkward on a phone.
      - name: Publish to the rolling "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest wiklodo.apk \
            --target "$GITHUB_SHA" \
            --title "Wiklodo - latest APK" \
            --notes "Sideloadable release build of \`$GITHUB_SHA\`.

          **Install:** download \`wiklodo.apk\` below, tap it, and allow
          your browser to install unknown apps when prompted.

          Android still offers to scan a sideloaded app with Play Protect;
          that check belongs to the device and no app can turn it off. You can
          decline the scan, or switch it off in Play Store, Play Protect,
          Settings.

          Signed with the project's own key, so this installs over an existing
          Wiklodo and keeps your collection. Needs a network connection - cards
          are fetched live from Wikipedia."
