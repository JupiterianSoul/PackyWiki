# The website version of Wikster: the same build the APK wraps, served from
# GitHub Pages so anyone can play in a browser, desktop included.
#
# The site is served from the `gh-pages` branch (Settings > Pages > Build and
# deployment > Source: Deploy from a branch), so this workflow publishes by
# replacing that branch with the build. It used to hand the build to
# actions/deploy-pages instead, which only works when the source is set to
# "GitHub Actions": every run failed at the deploy step while the site was
# updated by hand, which is a red tick on every push and a site nobody
# noticed was stale. It publishes itself now.
#
# The branch holds build output only and is replaced wholesale on each
# publish, so the push is a force-push on purpose: there is no history worth
# keeping in it, and the source branch is the record.
name: Publish the website

on:
  push:
    branches: [main, master, 'claude/**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

# A publish that is already running finishes; a newer one waits rather than
# racing it, so the live site is never half of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # As in the APK build: the Supabase URL and publishable key come from the
      # committed .env.production and must not be passed as env vars, or Vite
      # would let an empty process.env win and ship a site that cannot sign in.
      - name: Build
        run: |
          npm ci
          npm run build
          grep -q "supabase.co" dist/assets/*.js \
            || { echo "::error::Built bundle has no Supabase project in it."; exit 1; }

      # Pages serves the folder as-is. The app is a single page with no routes
      # of its own, so a copy of index.html answers any stray deep link
      # instead of the default 404, and .nojekyll stops Pages filtering out
      # the build's hashed filenames.
      - name: Add the fallback page
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          subject=$(git log -1 --pretty=%s)
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Site: ${subject}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Published ${subject}" >> "$GITHUB_STEP_SUMMARY"
