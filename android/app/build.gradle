plugins {
    id 'com.android.application'
}

/** CI passes the run number; a local build is always 1. */
def buildNumber = (System.getenv('BUILD_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.packywiki.app'
    compileSdk 35

    /*
     * A FIXED signing key, committed to the repo.
     *
     * Without this, `assembleDebug` falls back to ~/.android/debug.keystore -
     * and a CI runner is a fresh machine every time, so Gradle generated a
     * brand new random key on every single build. Android identifies an app by
     * its signature, so every build looked like a different app: no update
     * would install over the last one, and uninstalling to make room took the
     * player's whole collection with it.
     *
     * The key lives in the repo on purpose. It is a debug key for a
     * sideloaded app, the password is right here, and it protects nothing: a
     * debug-signed APK is not trustworthy to begin with. What it buys is the
     * one thing that actually matters here - every build updates in place and
     * keeps your save. If this ever ships properly, generate a real key and
     * pass it in through CI secrets instead.
     */
    signingConfigs {
        debug {
            storeFile file('../keystore/wiklodo-debug.keystore')
            storePassword 'wiklodo'
            keyAlias 'wiklodo'
            keyPassword 'wiklodo'
        }
    }

    defaultConfig {
        // Deliberately unchanged by the rename to Wiklodo. The applicationId
        // is the app's identity to Android AND the key to the WebView's
        // storage: changing it installs a second app and strands the player's
        // whole collection in the old one.
        applicationId 'com.packywiki.app'
        minSdk 26
        targetSdk 35
        // Rises with every CI build so Android always sees a newer version.
        // Falls back to 1 for a local build, which is fine: a local build is
        // never installed over a released one.
        //
        // Computed into a variable first, deliberately. Written inline as
        // `versionCode (expr) as int`, Groovy reads it as
        // `versionCode(expr) as int` - the cast lands on the setter's null
        // return value, and the build dies with "Value is null".
        versionCode buildNumber
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader - serves the bundled web build over a real https
    // origin instead of file://, so fetch() to Wikipedia obeys normal CORS.
    implementation 'androidx.webkit:webkit:1.12.1'
}

/*
 * The web build is the app. `npm run build` writes dist/, and this copies it
 * into the APK's assets. The Copy task no-ops when dist/ is absent, so the
 * Gradle build still configures cleanly on a fresh clone.
 */
tasks.register('copyWebAssets', Copy) {
    from "${rootDir}/../dist"
    into "${projectDir}/src/main/assets"
}

tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}
