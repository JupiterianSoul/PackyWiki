plugins {
    id 'com.android.application'
}

android {
    namespace 'com.packywiki.app'
    compileSdk 35

    defaultConfig {
        // Deliberately unchanged by the rename to Wiklodo. The applicationId
        // is the app's identity to Android AND the key to the WebView's
        // storage: changing it installs a second app and strands the player's
        // whole collection in the old one.
        applicationId 'com.packywiki.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader — serves the bundled web build over a real https
    // origin instead of file://, so fetch() to Wikipedia obeys normal CORS.
    implementation 'androidx.webkit:webkit:1.12.1'
}

/*
 * The web build is the app. `npm run build` writes dist/, and this copies it
 * into the APK's assets. The Copy task no-ops when dist/ is absent, so the
 * Gradle build still configures cleanly on a fresh clone.
 */
tasks.register('copyWebAssets', Copy) {
    from "${rootDir}/../dist"
    into "${projectDir}/src/main/assets"
}

tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}
